<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>UpStruk - Split Bill</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f4f8fb;
      margin: 0;
      padding: 0;
      color: #222;
    }
    .header {
      background: linear-gradient(90deg, #1976d2 60%, #42a5f5 100%);
      color: #fff;
      padding: 24px 0 16px 0;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(25, 118, 210, 0.08);
    }
    .header h1 {
      margin: 0;
      font-size: 2.2rem;
      letter-spacing: 2px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(25, 118, 210, 0.08);
      padding: 32px 24px 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    label, .total, .button {
      color: #1976d2;
      font-weight: 500;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background: #e3f0fa;
      border-radius: 8px;
      overflow: hidden;
    }
    table, th, td {
      border: 1px solid #90caf9;
    }
    th {
      background: #1976d2;
      color: #fff;
      padding: 10px 6px;
      font-size: 1rem;
      letter-spacing: 1px;
    }
    td {
      padding: 8px 6px;
      background: #f7fbff;
      font-size: 0.98rem;
    }
    .participant {
      border: 1.5px solid #90caf9;
      background: #e3f0fa;
      border-radius: 8px;
      padding: 16px;
      margin-top: 10px;
      box-shadow: 0 1px 4px rgba(25, 118, 210, 0.04);
    }
    .participant input[type="text"] {
      border: 1px solid #90caf9;
      border-radius: 4px;
      padding: 4px 8px;
      margin-bottom: 8px;
      width: 120px;
    }
    .participant input[type="number"] {
      border: 1px solid #90caf9;
      border-radius: 4px;
      padding: 2px 6px;
      width: 60px;
      margin-bottom: 4px;
    }
    .delete-btn {
      background-color: #e53935;
      color: #fff;
      border: none;
      margin-left: 10px;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .delete-btn:hover {
      background: #b71c1c;
    }
    .button button, button {
      background: #1976d2;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 1rem;
      margin-top: 10px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(25, 118, 210, 0.08);
      transition: background 0.2s;
    }
    .button button:hover, button:hover {
      background: #1565c0;
    }
    .total {
      margin-top: 10px;
      font-weight: bold;
      font-size: 1.1rem;
      color: #1976d2;
    }
    #totalResult {
      background: #e3f0fa;
      border-radius: 8px;
      padding: 18px 16px;
      margin-top: 18px;
      font-size: 1.05rem;
      color: #222;
      box-shadow: 0 1px 4px rgba(25, 118, 210, 0.04);
    }
    .status-success {
      color: #2e7d32;
      font-weight: bold;
    }
    .status-warning {
      color: #f9a825;
      font-weight: bold;
    }
    .status-error {
      color: #d32f2f;
      font-weight: bold;
    }
    @media (max-width: 700px) {
      .container { padding: 10px 2vw; }
      table, th, td { font-size: 0.95rem; }
      .header h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>UpStruk - Split Bill System</h1>
    <div style="font-size:1.1rem; font-weight:400;">Bagi tagihan struk dengan mudah dan adil</div>
  </div>
  <div class="container">
    <p id="storeInfo"></p>
    <div>
      <label for="strukSelect">Pilih Struk:</label>
      <select id="strukSelect" onchange="fetchStrukData()">
        <option value="">Pilih Struk</option>
      </select>
    </div>
    <h3>Daftar Produk</h3>
    <table id="productTable">
      <thead>
        <tr>
          <th>Nama Produk</th>
          <th>Jumlah</th>
          <th>Harga</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <button onclick="addParticipant()">Tambah Partisipan</button>
    <div id="participants"></div>
    <div class="button">
      <button onclick="calculateSplit()">Hitung Split</button>
    </div>
    <div class="total" id="totalResult"></div>
  </div>
  <pre id="output" style="white-space: pre-wrap;"></pre>
<script>
  // Memuat data ID struk dari API dan menampilkannya di dropdown
  function loadStrukIds() {
  fetch("http://127.0.0.1:8000/page/struk-list/")
    .then(res => res.json())
    .then(data => {
      // Urutkan berdasarkan id terbesar (terbaru) dan ambil 10 teratas
      const sortedData = data.sort((a, b) => b.id - a.id).slice(0, 10);

      console.log(sortedData);
      const strukSelect = document.getElementById("strukSelect");

      // Kosongkan dulu isi select-nya agar tidak duplikat saat load ulang
      strukSelect.innerHTML = '<option value="">Pilih ID Struk</option>';

      sortedData.forEach(struk => {
        const option = document.createElement("option");
        option.value = struk.id;
        option.textContent = `Struk: ${struk.nama_toko}`;
        strukSelect.appendChild(option);
      });
    })
    .catch(err => console.error("Error loading struk IDs:", err));
}


  function fetchStrukData() {
  const strukId = document.getElementById("strukSelect").value;
  if (!strukId) {
    alert("Pilih ID struk terlebih dahulu!");
    return;
  }

  fetch(`http://127.0.0.1:8000/page/struk-terbaru/${strukId}/`)
    .then(res => res.json())
    .then(data => {
      console.log(data);  // Log data untuk memeriksa respons API
      splitData.toko = data.toko;
      splitData.tanggal = data.tanggal;
      splitData.produk = data.produk;
      splitData.summary = data.summary;
      renderTable();
      renderStoreInfo();
    })
    .catch(err => {
      document.getElementById("storeInfo").innerText = "Gagal memuat data dari server.";
      console.error("Error:", err);
    });
  }

  let splitData = {
    toko: "",
    tanggal: "",
    produk: [],
    summary: {
      Subtotal: 0,
      Pajak: 0,
      "Biaya Layanan": 0,
      Diskon: 0,
      Lainnya: 0,
      "Grand Total": 0
    }
  };

  document.addEventListener("DOMContentLoaded", () => {
    loadStrukIds();
  });

  // Fungsi untuk merender tabel produk
  function renderTable() {
    const tbody = document.querySelector("#productTable tbody");
    tbody.innerHTML = "";
    splitData.produk.forEach(item => {
      tbody.innerHTML += `
        <tr>
          <td>${item.namaProduk}</td>
          <td>${item.jumlah}</td>
          <td>${item.harga}</td>
          <td>${item.jumlahHarga}</td>
        </tr>
      `;
    });
  }

  // Fungsi untuk merender informasi toko
  function renderStoreInfo() {
    document.getElementById("storeInfo").innerHTML = ` 
      <strong>Nama Toko:</strong> ${splitData.toko} <br>
      <strong>Tanggal:</strong> ${splitData.tanggal} <br>
      <strong>Grand Total:</strong> Rp ${splitData.summary["Grand Total"].toLocaleString()}
    `;
  }

  // Mengambil daftar produk
  function getProductList() {
    return splitData.produk.map(p => ({
      name: p.namaProduk,
      quantity: p.jumlah,
      price: p.harga
    }));
  }

  // Fungsi untuk menambahkan partisipan
  function addParticipant() {
    const productList = getProductList();
    const participantId = Date.now();
    const container = document.createElement("div");
    container.className = "participant";
    container.setAttribute("data-id", participantId);

    let html = `<label>Nama Orang:</label>
                <input type="text" placeholder="Nama" class="participant-name"/><br><label>Pilih Produk:</label><br>`;

    productList.forEach(product => {
      html += `${product.name} <input type="number" min="0" value="0" data-product="${product.name}" class="product-select"/><br>`;
    });

    html += `<button class="delete-btn" onclick="removeParticipant(${participantId})">Hapus</button>`;
    container.innerHTML = html;
    document.getElementById("participants").appendChild(container);
  }

  // Fungsi untuk menghapus partisipan
  function removeParticipant(id) {
    const el = document.querySelector(`.participant[data-id="${id}"]`);
    if (el) el.remove();
  }

  // Fungsi untuk menghitung pembagian tagihan
  function calculateSplit() {
    const productList = getProductList();
    const participants = document.querySelectorAll(".participant");
    const productTotals = {};
    const productActual = {};
    productList.forEach(p => {
      productTotals[p.name] = 0;
      productActual[p.name] = p.quantity;
    });

    participants.forEach(p => {
      p.querySelectorAll(".product-select").forEach(s => {
        const name = s.getAttribute("data-product");
        productTotals[name] += parseInt(s.value) || 0;
      });
    });

    const participantResults = [];
    participants.forEach(p => {
      const name = p.querySelector(".participant-name").value || "Tanpa Nama";
      const selects = p.querySelectorAll(".product-select");
      let subtotal = 0;
      let purchasedProducts = [];

      selects.forEach(s => {
        const pname = s.getAttribute("data-product");
        const qty = parseInt(s.value) || 0;
        const product = productList.find(pr => pr.name === pname);
        const totalQty = productTotals[pname];
        const actualQty = productActual[pname];
        const totalPrice = product.price * actualQty;

        // --- Perhitungan proporsional: harga produk dibagi sesuai input peserta ---
        let totalProduk = 0;
        // --- LOGIKA PEMBAGIAN SESUAI PERMINTAAN ---
        if (totalQty <= actualQty) {
          // Jika pembagian kurang dari/jumlah produk, pakai harga satuan
          totalProduk = qty * product.price;
          subtotal += totalProduk;
        } else if (totalQty > actualQty && totalQty > 0) {
          // Jika pembagian melebihi stok, bagi proporsional
          totalProduk = (qty / totalQty) * totalPrice;
          subtotal += totalProduk;
        }
        if (qty > 0) {
          purchasedProducts.push({ product: pname, quantity: qty, totalProduk: Math.round(totalProduk) });
        }
      });

      participantResults.push({ name, subtotal: Math.round(subtotal), purchasedProducts });
    });

    const subtotalSum = splitData.summary["Subtotal"];
    const grandTotal = splitData.summary["Grand Total"];
    const pajak = splitData.summary["Pajak"] || 0;
    const layanan = splitData.summary["Biaya Layanan"] || 0;
    const diskon = splitData.summary["Diskon"] || 0;
    const lainnya = splitData.summary["Lainnya"] || 0;

    // Dua kemungkinan lainnya: dianggap tambahan atau potongan
    const kemungkinanTambah = subtotalSum + pajak + layanan + lainnya - diskon;
    const kemungkinanKurang = subtotalSum + pajak + layanan - lainnya - diskon;

    const expectedGrand = Math.abs(kemungkinanTambah - grandTotal) <= Math.abs(kemungkinanKurang - grandTotal)
      ? kemungkinanTambah
      : kemungkinanKurang;

    const selisih = grandTotal - expectedGrand;
    const lainnyaLabel = expectedGrand === kemungkinanTambah ? "(Tambahan)" : "(Potongan)";
    let adjustment = 0;
    let keterangan = "";

    if (Math.abs(selisih) <= 1) {
      adjustment = 0;
      keterangan = "(Tanpa tambahan)";
    } else {
      adjustment = Math.round((grandTotal - subtotalSum) / participants.length);
      keterangan = "(Termasuk: Pajak, Biaya Layanan, Diskon, Lainnya)";
    }

    let resultHtml = `<h3>Hasil Split ${keterangan}:</h3>`;
    let totalCheck = 0;

    participantResults.forEach(result => {
      const total = result.subtotal + adjustment;
      totalCheck += total;

      // Hitung proporsi subtotal peserta terhadap subtotal semua
      const proporsi = subtotalSum > 0 ? result.subtotal / subtotalSum : 0;

      // Hitung bagian pajak, layanan, diskon, lainnya untuk peserta ini
      const pajakPerOrang = Math.round(pajak * proporsi);
      const layananPerOrang = Math.round(layanan * proporsi);
      const diskonPerOrang = Math.round(diskon * proporsi);
      const lainnyaPerOrang = Math.round(lainnya * proporsi);

      resultHtml += `<strong>${result.name}</strong><br>`;
      result.purchasedProducts.forEach(p => {
        resultHtml += `${p.product} - ${p.quantity} pcs = ${p.totalProduk.toLocaleString()}<br>`;
      });
      resultHtml += `<b>Total:</b> Rp ${total.toLocaleString()}<br><br>`;
    });

    resultHtml += `<b>Subtotal:</b> Rp ${subtotalSum.toLocaleString()}<br>`;
    if (diskon > 0) resultHtml += `<b>Diskon:</b> Rp ${diskon.toLocaleString()}<br>`;
    if (lainnya > 0) resultHtml += `<b>Lainnya:</b> Rp ${lainnya.toLocaleString()} ${lainnyaLabel}<br>`;
    if (pajak > 0) resultHtml += `<b>Pajak:</b> Rp ${pajak.toLocaleString()}<br>`;
    if (layanan > 0) resultHtml += `<b>Biaya Layanan:</b> Rp ${layanan.toLocaleString()}<br>`;
    resultHtml += `<b>Grand Total:</b> Rp ${grandTotal.toLocaleString()}<br>`;
    resultHtml += `<b>Total Semua Partisipan:</b> Rp ${totalCheck.toLocaleString()}`;

    // Tambahkan status split bill
    if (totalCheck == grandTotal) {
      resultHtml += `<br><span style="color:green;font-weight:bold;">Split bill sesuai dengan Grand Total.</span>`;
    } else if (totalCheck < grandTotal) {
      const kurang = grandTotal - totalCheck;
      resultHtml += `<br><span style="color:red;font-weight:bold;">Split bill belum sesuai, kurang Rp ${kurang.toLocaleString()} lagi.</span>`;
    } else if (totalCheck > grandTotal) {
      const lebih = totalCheck - grandTotal;
      resultHtml += `<br><span style="color:orange;font-weight:bold;">Split bill melebihi Grand Total, kelebihan Rp ${lebih.toLocaleString()}.</span>`;
    }

    // Cek produk yang belum terpilih
    let sisaProdukList = [];
    productList.forEach(p => {
      const sisa = p.quantity - productTotals[p.name];
      if (sisa > 0) {
        sisaProdukList.push(`${p.name} (${sisa} pcs)`);
      }
    });

    if (totalCheck < grandTotal && sisaProdukList.length > 0) {
      resultHtml += `<br><b>Produk yang belum terpilih/dibagi:</b><br>`;
      sisaProdukList.forEach(item => {
        resultHtml += `- ${item}<br>`;
      });
    }

    document.getElementById("totalResult").innerHTML = resultHtml;
  }
</script>
</body>
</html>
