<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpg" href="/Media/logo/UpStruk.jpg">
    <title>UpStruk - Struk Bensin</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f8fb;
            margin: 0;
            padding: 0;
            color: #222;
        }
        .header {
            background: linear-gradient(90deg, #1976d2 60%, #42a5f5 100%);
            color: #fff;
            padding: 24px 0 16px 0;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(25, 118, 210, 0.08);
        }
        .header h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 2px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 24px rgba(25, 118, 210, 0.08);
            padding: 32px 24px 24px 24px;
            display: flex;
            flex-direction: row;
            gap: 32px;
        }
        #preview {
            width: 220px;
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(25, 118, 210, 0.10);
            display: none;
            object-fit: contain;
            margin-bottom: 12px;
            background: #fff;
        }
        .result-container {
            flex: 1;
            border: 1.5px solid #90caf9;
            background: #e3f0fa;
            border-radius: 10px;
            padding: 18px 18px 12px 18px;
            min-width: 320px;
            box-shadow: 0 1px 4px rgba(25, 118, 210, 0.04);
        }
        #summary {
            margin-top: 10px;
            text-align: left;
            color: #1976d2;
            font-size: 1.08rem;
        }
        .divider {
            border-top: 2px dashed #1976d2;
            margin: 10px 0;
        }
        .editable {
            display: inline-block;
            min-width: 50px;
            padding: 2px;
            border: 1px dashed transparent;
            background: #e3f0fa;
            border-radius: 4px;
        }
        .editable:focus {
            border: 1px dashed #1976d2;
            outline: none;
            background: #fff;
        }
        button {
            margin-top: 10px;
            padding: 8px 18px;
            cursor: pointer;
            background: #1976d2;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(25, 118, 210, 0.08);
            transition: background 0.2s, transform 0.2s;
        }
        button:hover {
            background: #1565c0;
            transform: translateY(-2px) scale(1.03);
        }
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                padding: 10px 2vw;
                gap: 18px;
            }
            #preview {
                width: 100%;
                max-width: 320px;
                margin: 0 auto 12px auto;
                display: block;
            }
        }
        @media (max-width: 600px) {
            .container {
                padding: 6px 2vw;
            }
            .header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Unggah Struk Pembelian Bensin</h1>
        <div style="font-size:1.1rem; font-weight:400;">Upload gambar struk yang bersih, jelas, dan presisi</div>
    </div>
    <form id="uploadForm" method="POST" enctype="multipart/form-data" style="text-align:center; margin-bottom:18px;">
        {% csrf_token %}
        <input type="file" id="fileInput" name="image" accept="image/*" style="margin-bottom:10px;">
        <br>
        <button type="button" id="uploadButton">Unggah</button>
    </form>
    <div class="container">
        <img id="preview" src="" alt="Preview Gambar">
        <div class="result-container" id="resultContainer">
            <div id="summary"></div>
            <button id="saveButton" style="display:none;">Selesai</button>
        </div>
    </div>
    <button id="editButton" style="display:none;">Edit</button>
    <button id="downloadButton" style="display:none;">Unduh Hasil Gambar</button>
    <button id="downloadExcelButton" style="display:none;">Unduh Hasil Excel</button>
    <!-- Tambahkan tombol Save di bawah tombol download -->
    <button id="saveToDbButton" style="display:none;">Save Hasil</button>

<script>
    function getCookie(name) {
    let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                // Apakah ini cookie yang kita cari?
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    function setEditable(state) {
        const editableElements = document.querySelectorAll('.editable');
        editableElements.forEach(el => {
            el.contentEditable = state;
            el.style.border = state ? '1px dashed black' : 'none';
        });
    }

    document.getElementById('uploadButton').addEventListener('click', function () {
        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];

        if (!file) {
            alert("Pilih gambar terlebih dahulu!");
            return;
        }

        const formData = new FormData();
        formData.append('image', file);

        // Pratinjau gambar sebelum dikirim
        const reader = new FileReader();
        reader.onload = function (e) {
            const img = document.getElementById('preview');
            img.src = e.target.result;
            img.style.display = 'block';
        };
        reader.readAsDataURL(file);

        // Kirim data ke backend Django
        const csrftoken = getCookie('csrftoken');

        fetch(`${window.location.origin}/Bensin/`, {
            method: 'POST',
            body: formData,
            headers: {
                'X-CSRFToken': csrftoken
            }
        })
        .then(response => response.json())
        .then(data => {
            function makeEditable(value) {
                return `<span class="editable" contenteditable="true">${value}</span>`;
            }

            document.getElementById('saveButton').style.display = "block";
            document.getElementById('downloadButton').style.display = "none"; 

            document.getElementById('summary').innerHTML = `
                <p><strong>Nama SPBU:</strong> ${makeEditable(data["Nama SPBU"])}</p>
                <p><strong>Tanggal:</strong> ${makeEditable(data["Tanggal"])}</p>
                <div class="divider"></div>
                <p><strong>Produk:</strong> ${makeEditable(data["Produk"])}</p>
                <p><strong>Nominal:</strong> ${makeEditable(data["Nominal"])}</p>
                <p><strong>Volume:</strong> ${makeEditable(data["Volume"])}</p>
                <p><strong>Total Harga:</strong> ${makeEditable(data["Total Harga"])}</p>
            `;

            setEditable(true);
        })
        .catch(error => {
            console.error('Error Fetching:', error);
            alert("Terjadi kesalahan saat mengambil data. Silakan coba lagi.");
        });
    });

    document.getElementById('saveButton').addEventListener('click', function () {
        document.getElementById('saveButton').style.display = "none";

        // Nonaktifkan semua field editable
        setEditable(false);

        // Tampilkan tombol unduh dan edit
        document.getElementById('editButton').style.display = "block";
        document.getElementById('downloadButton').style.display = "block";
        document.getElementById('downloadExcelButton').style.display = "block";
        document.getElementById('saveToDbButton').style.display = "block"; // Tampilkan tombol Save ke DB
    });

    document.getElementById('editButton').addEventListener('click', function () {
        document.getElementById('saveButton').style.display = "block";
        document.getElementById('editButton').style.display = "none";
        document.getElementById('downloadExcelButton').style.display = "none";
        document.getElementById('downloadButton').style.display = "none";

        // Aktifkan kembali field editable
        setEditable(true);
    });

    document.getElementById('downloadButton').addEventListener('click', function () {
        const resultContainer = document.getElementById('resultContainer');
        const spbuName = document.querySelector("#summary p span")?.textContent || "SPBU";

        html2canvas(resultContainer).then(canvas => {
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = `Hasil_Struk_${spbuName}.png`;
            link.click();
        });
    });

    document.getElementById('downloadExcelButton').addEventListener('click', function () {
        let summaryElements = document.querySelectorAll("#summary p span");
        
        let summaryData = {
            "Nama SPBU": summaryElements[0]?.textContent || "",
            "Tanggal": summaryElements[1]?.textContent || "",
            "Produk": summaryElements[2]?.textContent || "",
            "Nominal": summaryElements[3]?.textContent || "",
            "Volume": summaryElements[4]?.textContent || "",
            "Total Harga": summaryElements[5]?.textContent || "",
        };

        let sumData = [
            ["Nama SPBU", summaryData["Nama SPBU"]],
            ["Tanggal", summaryData["Tanggal"]],
            ["Produk", summaryData["Produk"]],
            ["Nominal", summaryData["Nominal"]],
            ["Volume", summaryData["Volume"]],
            ["Total Harga", summaryData["Total Harga"]],
            [""],
        ];

        let FinalData = [...sumData];

        let newWs = XLSX.utils.aoa_to_sheet(FinalData);
        let wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, newWs, "Data Struk");

        const fileName = `Data_Struk_${summaryData["Nama SPBU"]}.xlsx`;
        XLSX.writeFile(wb, fileName);
    });

    // Event untuk tombol Save ke Database
    document.getElementById('saveToDbButton').addEventListener('click', function () {
        let summaryElements = document.querySelectorAll("#summary p span");
        let summaryData = {
            "Nama SPBU": summaryElements[0]?.textContent || "",
            "Tanggal": summaryElements[1]?.textContent || "",
            "Produk": summaryElements[2]?.textContent || "",
            "Nominal": summaryElements[3]?.textContent || "",
            "Volume": summaryElements[4]?.textContent || "",
            "Total Harga": summaryElements[5]?.textContent || "",
        };

        fetch(`${window.location.origin}/save-bensin/`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": getCookie('csrftoken')
            },
            body: JSON.stringify(summaryData)
        })
        .then(res => res.json())
        .then(data => {
            alert(data.message || "Data berhasil disimpan!");
            // document.getElementById('saveToDbButton').style.display = "none"; // HAPUS atau KOMENTARI baris ini
        })
        .catch(err => {
            alert("Gagal menyimpan data ke database.");
            console.error(err);
        });
    });
</script>
</body>
</html>
