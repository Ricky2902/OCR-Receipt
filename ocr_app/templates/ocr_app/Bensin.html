<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Struk Bensin</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: left;
            padding: 20px;
        }
        .container {
            display: flex;
            justify-content: left;
            align-items: flex-start;
            gap: 20px;
        }
        #preview {
            width: 30%;
            display: none;
        }
        .result-container {
            width: 70%;
            border: 2px solid #000;
            padding: 10px;
        }
        #output {
            margin-top: 10px;
            text-align: left;
        }
        .divider {
            border-top: 2px dashed black;
            margin: 10px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        .editable {
            display: inline-block;
            min-width: 50px;
            padding: 2px;
            border: 1px dashed transparent;
        }
        .editable:focus {
            border: 1px dashed black;
            outline: none;
        }
        button {
            margin-top: 10px;
            padding: 8px;
            cursor: pointer;
        }
        #uploadform {
            margin-top: 10px;
            padding: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Unggah Struk pembelian bensin yang akan diproses</h1>
    <p>Diharapkan Mengupload Gambar yang Bersih dan Jelas serta Sejajar dan Presisi !!!</p>
    
    <form id="uploadForm" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="file" id="fileInput" name="image" accept="image/*">
        <br><br>
        <button type="button" id="uploadButton">Unggah</button>
    </form>

    <div class="container">
        <img id="preview" src="" alt="Preview Gambar">
        <div class="result-container" id="resultContainer">
            <div id="summary"></div>
            <button id="saveButton" style="display:none;">Selesai</button>
        </div>
    </div>
    <button id="editButton" style="display:none;">Edit</button>
    <button id="downloadButton" style="display:none;">Unduh Hasil Gambar</button>
    <button id="downloadExcelButton" style="display:none;">Unduh Hasil Excel</button>

<script>
    function getCookie(name) {
    let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                // Apakah ini cookie yang kita cari?
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    function setEditable(state) {
        const editableElements = document.querySelectorAll('.editable');
        editableElements.forEach(el => {
            el.contentEditable = state;
            el.style.border = state ? '1px dashed black' : 'none';
        });
    }

    document.getElementById('uploadButton').addEventListener('click', function () {
        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];

        if (!file) {
            alert("Pilih gambar terlebih dahulu!");
            return;
        }

        const formData = new FormData();
        formData.append('image', file);

        // Pratinjau gambar sebelum dikirim
        const reader = new FileReader();
        reader.onload = function (e) {
            const img = document.getElementById('preview');
            img.src = e.target.result;
            img.style.display = 'block';
        };
        reader.readAsDataURL(file);

        // Kirim data ke backend Django
        const csrftoken = getCookie('csrftoken');

        fetch(`${window.location.origin}/page/Bensin/`, {
            method: 'POST',
            body: formData,
            headers: {
                'X-CSRFToken': csrftoken
            }
        })
        .then(response => response.json())
        .then(data => {
            function makeEditable(value) {
                return `<span class="editable" contenteditable="true">${value}</span>`;
            }

            document.getElementById('saveButton').style.display = "block";
            document.getElementById('downloadButton').style.display = "none"; 

            document.getElementById('summary').innerHTML = `
                <p><strong>Nama SPBU:</strong> ${makeEditable(data["Nama SPBU"])}</p>
                <p><strong>Tanggal:</strong> ${makeEditable(data["Tanggal"])}</p>
                <div class="divider"></div>
                <p><strong>Produk:</strong> ${makeEditable(data["Produk"])}</p>
                <p><strong>Nominal:</strong> ${makeEditable(data["Nominal"])}</p>
                <p><strong>Volume:</strong> ${makeEditable(data["Volume"])}</p>
                <p><strong>Total Harga:</strong> ${makeEditable(data["Total Harga"])}</p>
            `;

            setEditable(true);
        })
        .catch(error => {
            console.error('Error Fetching:', error);
            alert("Terjadi kesalahan saat mengambil data. Silakan coba lagi.");
        });
    });

    document.getElementById('saveButton').addEventListener('click', function () {
        document.getElementById('saveButton').style.display = "none";

        // Nonaktifkan semua field editable
        setEditable(false);

        // Tampilkan tombol unduh dan edit
        document.getElementById('editButton').style.display = "block";
        document.getElementById('downloadButton').style.display = "block";
        document.getElementById('downloadExcelButton').style.display = "block";
    });

    document.getElementById('editButton').addEventListener('click', function () {
        document.getElementById('saveButton').style.display = "block";
        document.getElementById('editButton').style.display = "none";
        document.getElementById('downloadExcelButton').style.display = "none";
        document.getElementById('downloadButton').style.display = "none";

        // Aktifkan kembali field editable
        setEditable(true);
    });

    document.getElementById('downloadButton').addEventListener('click', function () {
        const resultContainer = document.getElementById('resultContainer');
        const spbuName = document.querySelector("#summary p span")?.textContent || "SPBU";

        html2canvas(resultContainer).then(canvas => {
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = `Hasil_Struk_${spbuName}.png`;
            link.click();
        });
    });

    document.getElementById('downloadExcelButton').addEventListener('click', function () {
        let summaryElements = document.querySelectorAll("#summary p span");
        
        let summaryData = {
            "Nama SPBU": summaryElements[0]?.textContent || "",
            "Tanggal": summaryElements[1]?.textContent || "",
            "Produk": summaryElements[2]?.textContent || "",
            "Nominal": summaryElements[3]?.textContent || "",
            "Volume": summaryElements[4]?.textContent || "",
            "Total Harga": summaryElements[5]?.textContent || "",
        };

        let sumData = [
            ["Nama SPBU", summaryData["Nama SPBU"]],
            ["Tanggal", summaryData["Tanggal"]],
            ["Produk", summaryData["Produk"]],
            ["Nominal", summaryData["Nominal"]],
            ["Volume", summaryData["Volume"]],
            ["Total Harga", summaryData["Total Harga"]],
            [""],
        ];

        let FinalData = [...sumData];

        let newWs = XLSX.utils.aoa_to_sheet(FinalData);
        let wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, newWs, "Data Struk");

        const fileName = `Data_Struk_${summaryData["Nama SPBU"]}.xlsx`;
        XLSX.writeFile(wb, fileName);
    });
</script>

</body>
</html>
